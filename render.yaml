databases:
  - name: pps-legajo-demo-db
    databaseName: datos_empleados_demo
    user: legajo_demo
    plan: free
    postgresMajorVersion: "17"
    ipAllowList: []

services:
  - type: web
    name: pps-legajo-demo-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run start:demo
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_SEED_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: pps-legajo-demo-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DEMO_ADMIN_USERNAME
        value: admin-demo
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_USER_USERNAME
        value: usuario-demo
      - key: DEMO_USER_PASSWORD
        sync: false
